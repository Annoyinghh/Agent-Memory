# Agent-Memory — Docker Compose orchestration.
#
#   docker compose up -d --build     # build & start
#   docker compose ps                # health
#   docker compose logs -f backend   # tail logs
#   docker compose down              # stop (data volume on host is preserved)
#
# Frontend (Next.js standalone) reverse-proxies /api/* to the backend over the
# compose internal network, so the browser only ever talks to ONE host port (3000).
# The backend port (8900) is also published for direct Swagger access; comment out
# to hide it from the LAN.

services:
  backend:
    image: agent-memory-server
    build:
      context: .                       # repo root (so the graphify sibling dir is in context)
      dockerfile: Agent-Memory-Server/Dockerfile
    container_name: agent-memory-backend
    ports:
      - "8900:8900"                    # REST API + Swagger (/docs). Remove to hide from LAN.
    environment:
      PROTECTED_NAMESPACES: ${PROTECTED_NAMESPACES:-test}
      PYTHONIOENCODING: utf-8
      # Writable cache dir for graphify AST cache (graphify-out/cache/). Must NOT
      # point at a read-only mount, or every extraction worker fails with EROFS.
      GRAPHIFY_CACHE_DIR: /app/.graphify-cache
      # Optional — only used by consolidate_memory (litellm):
      LLM_MODEL: ${LLM_MODEL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # headroom reversible compression (optional). Telemetry off by default; CCR originals
      # cache lives on the persisted /app/data volume so the REST container and per-call MCP
      # containers share it. Set HEADROOM_ENABLED=0 to force-disable even if installed.
      HEADROOM_TELEMETRY: ${HEADROOM_TELEMETRY:-off}
      HEADROOM_CCR_DIR: /app/data/headroom-ccr
      HEADROOM_ENABLED: ${HEADROOM_ENABLED:-1}
    volumes:
      # Persist the existing SQLite + ChromaDB. Single owner = this container.
      - ./Agent-Memory-Server/data:/app/data
      # Persistent writable graphify AST cache (so re-extraction is faster and
      # never touches the source mount). See GRAPHIFY_CACHE_DIR above.
      - graphify-cache:/app/.graphify-cache
      # shipbearERP 代码库只读挂载，供 graphify 读取抽取。:ro 安全——缓存走上面的卷，
      # graphify 不会往源码仓库写任何东西（graphify-out/cache → GRAPHIFY_CACHE_DIR）。
      - E:/shipbearERP-master:/workspace:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8900/health',timeout=3).status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  mcp:
    # 长驻 MCP-over-HTTP 服务（局域网远程接入）。本机 per-call stdio MCP 仍由各 CLI
    # 自己 `docker run`（见 ~/.claude.json），两者共存、不冲突。
    # 走 streamable-http，默认无鉴权 —— 仅在可信内网使用（见 README「安全」一节）。
    image: agent-memory-server
    container_name: agent-memory-mcp
    command: ["python", "server.py"]
    ports:
      - "8901:8901"                    # 远端 CLI 接入点：http://<本机IP>:8901/mcp
    environment:
      MCP_TRANSPORT: streamable-http
      MCP_HOST: 0.0.0.0                # 必须 0.0.0.0；127.0.0.1 则局域网连不上
      MCP_PORT: "8901"
      PYTHONIOENCODING: utf-8
      PROTECTED_NAMESPACES: ${PROTECTED_NAMESPACES:-test}
      GRAPHIFY_CACHE_DIR: /app/.graphify-cache
      HEADROOM_TELEMETRY: off
      HEADROOM_CCR_DIR: /app/data/headroom-ccr
      HEADROOM_ENABLED: ${HEADROOM_ENABLED:-1}
    volumes:
      # 与 backend 共享同一库（已实测：MCP 容器写、REST 容器立即读到，并发正常）。
      - ./Agent-Memory-Server/data:/app/data
      - graphify-cache:/app/.graphify-cache
      # 代码库（只读），供 sync_codebase / precise_source_search。
      - E:/shipbearERP-master:/workspace:ro
      # 开发期：让本服务直接用本地 server.py（免为这点改动重建镜像）。重建镜像后可删此行。
      - ./Agent-Memory-Server/server.py:/app/server.py:ro
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy

  frontend:
    image: agent-memory-ui
    build:
      context: Agent-memory-ui
    container_name: agent-memory-frontend
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  graphify-cache:
